[project]
name = "carebridge"
version = "0.1.0"
description = "AI post-discharge care companion built with the Strands Agents SDK."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aws-opentelemetry-distro>=0.10",
  "bedrock-agentcore>=0.1",
  "boto3>=1.35",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pypdf>=5",
  "python-multipart>=0.0.12",
  "strands-agents>=1.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
deploy = [
  "bedrock-agentcore>=0.1",
  "aws-opentelemetry-distro>=0.10",
]
evals = [
  "strands-agents-evals>=0.1",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
carebridge = "carebridge.cli:main"

[tool.agentcore]
entrypoint = "app/CareBridge/main.py"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["app/CareBridge"]

[tool.setuptools.package-data]
carebridge = ["agents/skills/**/*.md", "sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app/CareBridge"]
